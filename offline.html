<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>Sin conexión — Perlo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --neon-cyan:   #00f3ff;
      --neon-purple: #a044ff;
      --neon-pink:   #e100ff;
      --bg:          #000000;
      --text:        #ffffff;
      --text-muted:  rgba(255,255,255,0.45);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Partículas de fondo animadas */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: grid-drift 20s linear infinite;
      z-index: 0;
    }

    @keyframes grid-drift {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Orbe de fondo */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: orb-float 8s ease-in-out infinite;
      z-index: 0;
    }

    .bg-orb.orb-1 {
      width: 500px; height: 500px;
      background: var(--neon-cyan);
      top: -150px; left: -150px;
      animation-delay: 0s;
    }

    .bg-orb.orb-2 {
      width: 400px; height: 400px;
      background: var(--neon-purple);
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }

    @keyframes orb-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%       { transform: translate(20px, -20px) scale(1.05); }
    }

    /* Contenido principal */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
      text-align: center;
    }

    /* Ícono animado */
    .icon-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }

    .icon-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: ring-pulse 2.5s ease-in-out infinite;
    }

    @keyframes ring-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    .icon-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 52px;
      animation: icon-pulse 2.5s ease-in-out infinite;
    }

    @keyframes icon-pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    /* Título */
    .title {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    /* Subtítulo */
    .subtitle {
      font-size: clamp(14px, 3vw, 16px);
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 340px;
      margin-bottom: 48px;
    }

    /* Separador */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 300px;
      gap: 16px;
      margin-bottom: 32px;
      opacity: 0.2;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--text);
    }

    .divider-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--text);
      white-space: nowrap;
    }

    /* Botón reintentar */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: transparent;
      border: 1.5px solid rgba(0, 243, 255, 0.4);
      border-radius: 12px;
      color: var(--neon-cyan);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      text-decoration: none;
    }

    .btn-retry:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    /* Logo Perlo en el pie */
    .footer-brand {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.5;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="container">

    <div class="icon-wrapper">
      <div class="icon-ring"></div>
      <div class="icon-inner" aria-hidden="true">📡</div>
    </div>

    <h1 class="title">Sin conexión a internet</h1>

    <p class="subtitle">
      Perlo no puede conectarse en este momento.<br>
      Verifica tu red e intenta de nuevo.
    </p>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-label">PERLO</span>
      <div class="divider-line"></div>
    </div>

    <a href="./" class="btn-retry" id="retry-btn" aria-label="Reintentar conexión">
      🔄 Reintentar
    </a>

  </div>

  <span class="footer-brand">PERLO</span>

  <script>
    // Redirigir automáticamente cuando recupere conexión
    window.addEventListener('online', function () {
      window.location.href = './';
    });

    document.getElementById('retry-btn').addEventListener('click', function (e) {
      e.preventDefault();
      if (navigator.onLine) {
        window.location.href = './';
      } else {
        window.location.reload();
      }
    });
  </script>

</body>
</html>
