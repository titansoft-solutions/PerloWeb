  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      z-index: 99999;
      /* Fade-out suave al eliminar */
      transition: opacity 0.4s ease;
    }

    #loading-indicator.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-indicator #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #loading-indicator canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Botón instalar PWA — oculto hasta que el browser lo dispare */
    #pwa-install-btn {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100000;
      background: linear-gradient(135deg, #00f3ff, #a044ff);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      animation: pwa-pulse 2.5s ease-in-out infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #pwa-install-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
    }

    @keyframes pwa-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
      50%       { box-shadow: 0 0 35px rgba(160, 68, 255, 0.6); }
    }

    /* Banner offline */
    #offline-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99998;
      background: linear-gradient(90deg, #FF8C00, #E65100);
      color: #fff;
      text-align: center;
      padding: 8px 16px;
      font-family: 'Segoe UI', Roboto, sans-serif;

<body>

  <!-- ═══════════════════════════════════════════
       LOADING SCREEN (se elimina al arrancar Flutter)
  ═══════════════════════════════════════════ -->
  <div id="loading-indicator" role="progressbar" aria-label="Cargando Perlo">
    <div id="canvas-container">
      <canvas id="hudCanvas"></canvas>
    </div>
    <script>
      const canvas = document.getElementById('hudCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const pulses = [];
      const maxParticles = 130;
      const connectionDist = 78;

      class Particle {
        constructor(cx, cy) {
          const angle = Math.random() * Math.PI * 2;
          const radiusX = Math.random() * 170 + 100;
          const radiusY = radiusX * (0.65 + (Math.random() - 0.5) * 0.1);

          this.baseX = cx + Math.cos(angle) * radiusX;
          this.baseY = cy + Math.sin(angle) * radiusY;
          this.x = this.baseX;
          this.y = this.baseY;

          this.orbitSpeed = (Math.random() * 0.0003 + 0.0001) * (Math.random() < 0.5 ? 1 : -1);
          this.orbitAngle = angle;
          this.radiusX = radiusX;
          this.radiusY = radiusY;
          this.radius = Math.random() * 2.5 + 1.2;

          if (Math.random() < 0.5) {
            this.color = Math.random() < 0.7 ? "0, 243, 255" : "0, 85, 255";
          } else {
            this.color = Math.random() < 0.7 ? "225, 0, 255" : "155, 45, 255";
          }

          this.alpha = Math.random() * 0.5 + 0.4;
          this.baseAlpha = this.alpha;
          this.timeOffset = Math.random() * 100;
          this.neighbors = [];
        }

        update(globalTime, cx, cy) {
          this.orbitAngle += this.orbitSpeed;
          this.baseX = cx + Math.cos(this.orbitAngle) * this.radiusX;
          this.baseY = cy + Math.sin(this.orbitAngle) * this.radiusY;

          const waveX = Math.sin(globalTime * 0.0008 + this.timeOffset) * 8;
          const waveY = Math.cos(globalTime * 0.0012 + this.timeOffset * 1.3) * 6;

          let targetX = this.baseX + waveX;
          let targetY = this.baseY + waveY;

          const distToLogo = Math.hypot(targetX - cx, targetY - cy);
          const exclusionRadius = 90;

          if (distToLogo < exclusionRadius) {
            const pushAngle = Math.atan2(targetY - cy, targetX - cx);
            targetX = cx + Math.cos(pushAngle) * exclusionRadius;
            targetY = cy + Math.sin(pushAngle) * exclusionRadius;
          }

          this.x = targetX;
          this.y = targetY;

          const pulseIntensity = Math.sin(globalTime * 0.0025 + this.timeOffset) * 0.2 + 0.8;
          this.alpha = this.baseAlpha * pulseIntensity;
          this.neighbors = [];
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;

          let blurRadius = this.radius * 3.5;
          let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, blurRadius);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.2, `rgba(${this.color}, 1)`);
          grad.addColorStop(0.6, `rgba(${this.color}, 0.15)`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, blurRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      class Pulse {
        constructor(startParticle, endParticle) {
          this.start = startParticle;
          this.end = endParticle;
          this.progress = 0;
          this.speed = Math.random() * 0.02 + 0.015;
          this.color = startParticle.color;
          this.size = Math.random() * 1.5 + 1.5;
        }

        update() { this.progress += this.speed; }

        draw() {
          const currentX = this.start.x + (this.end.x - this.start.x) * this.progress;
          const currentY = this.start.y + (this.end.y - this.start.y) * this.progress;

          ctx.save();
          ctx.globalAlpha = Math.min(this.start.alpha, this.end.alpha) * 1.3;

          let pulseGrad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, this.size * 3.5);
          pulseGrad.addColorStop(0, '#ffffff');
          pulseGrad.addColorStop(0.3, `rgba(${this.color}, 1)`);
          pulseGrad.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.fillStyle = pulseGrad;
          ctx.beginPath();
          ctx.arc(currentX, currentY, this.size * 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const cxCenter = window.innerWidth / 2;
      const cyCenter = window.innerHeight / 2 - 30;
      for (let i = 0; i < maxParticles; i++) {
        particles.push(new Particle(cxCenter, cyCenter));
      }

      function drawLogoSequence(cx, cy) {
        ctx.save();
        ctx.translate(cx, cy - 30);

        let cyanGrad = ctx.createLinearGradient(-50, -50, 50, 50);
        cyanGrad.addColorStop(0, '#00f3ff');
        cyanGrad.addColorStop(1, '#0055ff');

        let purpleGrad = ctx.createLinearGradient(-50, -50, 50, 50);
        purpleGrad.addColorStop(0, '#e100ff');
        purpleGrad.addColorStop(1, '#6600ff');

        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = cyanGrad;
        ctx.beginPath();
        ctx.moveTo(-60, -45); ctx.lineTo(0, -80); ctx.lineTo(60, -45);
        ctx.lineTo(60, 15); ctx.lineTo(0, 50); ctx.lineTo(0, 15);
        ctx.lineTo(35, -5); ctx.lineTo(35, -30); ctx.lineTo(0, -50);
        ctx.lineTo(-35, -30); ctx.lineTo(-35, 45); ctx.lineTo(0, 80);
        ctx.moveTo(-60, -45); ctx.lineTo(-60, 55);
        ctx.stroke();

        ctx.lineWidth = 3.5;
        ctx.strokeStyle = purpleGrad;
        ctx.beginPath();
        ctx.moveTo(-55, 50); ctx.lineTo(-55, -40); ctx.lineTo(0, -72);
        ctx.lineTo(55, -40); ctx.lineTo(55, 12); ctx.lineTo(0, 44);
        ctx.lineTo(0, 35); ctx.lineTo(35, 15); ctx.lineTo(35, -5);
        ctx.moveTo(0, -50); ctx.lineTo(0, 15);
        ctx.stroke();

        ctx.lineWidth = 4.5;
        ctx.strokeStyle = cyanGrad;
        ctx.beginPath(); ctx.arc(0, -18, 11, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = purpleGrad;
        ctx.beginPath(); ctx.arc(0, -18, 4, 0, Math.PI * 2); ctx.fill();

        let brandGrad = ctx.createLinearGradient(-100, 0, 100, 0);
        brandGrad.addColorStop(0, '#00f3ff');
        brandGrad.addColorStop(0.5, '#a044ff');
        brandGrad.addColorStop(1, '#e100ff');

        ctx.fillStyle = brandGrad;
        ctx.font = 'bold 58px "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '4px';
        ctx.fillText('Perlo', 0, 150);

        ctx.restore();
      }

      let animationId = null;
      function mainLoop(timestamp) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.globalCompositeOperation = 'lighter';
        const cellSize = connectionDist;
        const grid = {};

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.update(timestamp, cx, cy - 30);
          p.draw();

          const cellX = Math.floor(p.x / cellSize);
          const cellY = Math.floor(p.y / cellSize);
          const cellKey = `${cellX},${cellY}`;

          if (!grid[cellKey]) grid[cellKey] = [];
          grid[cellKey].push(p);
        }

        ctx.save();
        ctx.lineWidth = 1.1;

        for (let cellKey in grid) {
          const [cxCoord, cyCoord] = cellKey.split(',').map(Number);
          const currentCellParticles = grid[cellKey];

          for (let dx = 0; dx <= 1; dx++) {
            for (let dy = (dx === 0 ? 0 : -1); dy <= 1; dy++) {
              const neighborKey = `${cxCoord + dx},${cyCoord + dy}`;
              const neighborParticles = grid[neighborKey];

              if (!neighborParticles) continue;

              for (let i = 0; i < currentCellParticles.length; i++) {
                const p1 = currentCellParticles[i];
                const startIdx = (neighborKey === cellKey) ? i + 1 : 0;

                for (let j = startIdx; j < neighborParticles.length; j++) {
                  const p2 = neighborParticles[j];
                  const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);

                  if (dist < connectionDist) {
                    p1.neighbors.push(p2);
                    ctx.globalAlpha = Math.min(p1.alpha, p2.alpha) * 0.38;
                    ctx.strokeStyle = `rgba(${p1.color}, 0.9)`;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                  }
                }
              }
            }
          }
        }
        ctx.restore();

        if (Math.random() < 0.5 && pulses.length < 32) {
          const source = particles[Math.floor(Math.random() * particles.length)];
          if (source.neighbors.length > 0) {
            const target = source.neighbors[Math.floor(Math.random() * source.neighbors.length)];
            pulses.push(new Pulse(source, target));
          }
        }

        for (let i = pulses.length - 1; i >= 0; i--) {
          const pulse = pulses[i];
          pulse.update();
          pulse.draw();
          if (pulse.progress >= 1) { pulses.splice(i, 1); }
        }

        drawLogoSequence(cx, cy);
        ctx.globalCompositeOperation = 'source-over';
        animationId = requestAnimationFrame(mainLoop);
      }

      animationId = requestAnimationFrame(mainLoop);

      // Exponer función de cleanup global para que Dart la llame
      window.__perloStopLoadingAnimation = function() {
        if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
      };
    </script>
  </div>

  <!-- ═══════════════════════════════════════════

  <div id="offline-banner" role="alert" aria-live="polite">

  <!-- ═══════════════════════════════════════════

  <button id="pwa-install-btn" aria-label="Instalar Perlo como aplicación">
    ⬇️ Instalar Perlo
  </button>

  <!-- ═══════════════════════════════════════════
       SCRIPTS PWA
  ═══════════════════════════════════════════ -->
  <script>
    // ── 1. Capturar evento beforeinstallprompt ─────────────────────────────
    let _deferredInstallPrompt = null;
    const installBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      _deferredInstallPrompt = e;
      installBtn.style.display = 'block';
      console.log('[Perlo PWA] beforeinstallprompt capturado — mostrando botón instalar');
    });

    installBtn.addEventListener('click', async function () {
      if (!_deferredInstallPrompt) return;
      installBtn.style.display = 'none';
      _deferredInstallPrompt.prompt();
      const { outcome } = await _deferredInstallPrompt.userChoice;
      console.log('[Perlo PWA] Usuario eligió:', outcome);
      _deferredInstallPrompt = null;
    });

    // Ocultar botón si ya está instalada como PWA
    window.addEventListener('appinstalled', function () {
      installBtn.style.display = 'none';
      _deferredInstallPrompt = null;
      console.log('[Perlo PWA] App instalada correctamente');
    });

    // ── 2. Banner offline / online ─────────────────────────────────────────
    const offlineBanner = document.getElementById('offline-banner');

    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineBanner.style.display = 'block';
      } else {
        offlineBanner.style.display = 'none';
      }
    }

    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus(); // chequeo inicial

    // Exponer estado para Dart via JS interop
    window.__perloIsOnline = function() { return navigator.onLine; };

    // ── 3. Lector PWA nativo con BarcodeDetector ───────────────────────────
    // Chrome/Edge modernos pueden detectar códigos con la API nativa del
    // navegador. Si no existe o falla, Dart recibe "fallback" y usa el lector
    // actual de mobile_scanner/ZXing sin mostrar errores al usuario.
    window.__perloScanBarcodeDetector = async function() {
      const formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
      if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) {
        return { status: 'fallback' };
      }

      try {
        if (BarcodeDetector.getSupportedFormats) {
          const supported = await BarcodeDetector.getSupportedFormats();
          if (!formats.some((format) => supported.includes(format))) {
            return { status: 'fallback' };
          }
        }

        const detector = new BarcodeDetector({ formats });
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, min: 20 }
          }
        });

        return await new Promise(async (resolve) => {
          let stopped = false;
          let pendingDetection = false;
          let detectionErrors = 0;
          let torchEnabled = false;

          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;background:#000;overflow:hidden;';

          const video = document.createElement('video');
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.srcObject = stream;
          video.style.cssText = 'width:100%;height:100%;object-fit:cover;';

          const frame = document.createElement('div');
          frame.style.cssText = 'position:absolute;left:5%;top:33%;width:90%;height:34%;border:2px solid #00f3ff;border-radius:16px;box-sizing:border-box;box-shadow:0 0 0 9999px rgba(0,0,0,.42);';

          const help = document.createElement('div');
          help.textContent = 'Apunta al codigo de barras dentro del recuadro';
          help.style.cssText = 'position:absolute;left:24px;right:24px;bottom:36px;color:rgba(255,255,255,.78);font-family:Segoe UI,Roboto,sans-serif;font-size:13px;text-align:center;';

          const close = document.createElement('button');
          close.textContent = '×';
          close.style.cssText = 'position:absolute;top:34px;right:20px;width:44px;height:44px;border:0;border-radius:22px;background:rgba(0,0,0,.45);color:#fff;font-size:34px;line-height:38px;';

          const torch = document.createElement('button');
          torch.textContent = 'Linterna';
          torch.style.cssText = 'display:none;position:absolute;top:40px;left:20px;border:1px solid rgba(0,243,255,.45);border-radius:12px;background:rgba(0,243,255,.16);color:#00f3ff;padding:10px 14px;font-family:Segoe UI,Roboto,sans-serif;font-weight:700;';

          overlay.append(video, frame, help, close, torch);
          document.body.appendChild(overlay);

          const stop = (result) => {
            if (stopped) return;
            stopped = true;
            video.pause();
            stream.getTracks().forEach((track) => track.stop());
            overlay.remove();
            resolve(result);
          };

          close.addEventListener('click', () => stop({ status: 'cancelled' }));

          const [track] = stream.getVideoTracks();
          try {
            const capabilities = track?.getCapabilities?.() ?? {};
            if (capabilities.focusMode) {
              track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
            if (capabilities.torch) {
              torch.style.display = 'block';
              torch.addEventListener('click', () => {
                torchEnabled = !torchEnabled;
                torch.textContent = torchEnabled ? 'Linterna ON' : 'Linterna';
                track.applyConstraints({ advanced: [{ torch: torchEnabled }] }).catch(() => {});
              });
            }
          } catch (_) {}

          try {
            await video.play();
          } catch (_) {
            stop({ status: 'fallback' });
            return;
          }

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          const scan = async () => {
            if (stopped) return;
            if (!video.videoWidth || !video.videoHeight || pendingDetection) {
              requestAnimationFrame(scan);
              return;
            }

            pendingDetection = true;
            const sourceWidth = video.videoWidth * 0.9;
            const sourceHeight = video.videoHeight * 0.34;
            const sourceX = (video.videoWidth - sourceWidth) / 2;
            const sourceY = (video.videoHeight - sourceHeight) / 2;
            canvas.width = Math.round(sourceWidth);
            canvas.height = Math.round(sourceHeight);
            ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);

            try {
              const codes = await detector.detect(canvas);
              pendingDetection = false;
              const code = codes.find((barcode) => barcode.rawValue?.trim())?.rawValue.trim();
              if (code) {
                stop({ status: 'detected', code });
                return;
              }
            } catch (_) {
              pendingDetection = false;
              detectionErrors += 1;
              if (detectionErrors >= 3) {
                stop({ status: 'fallback' });
                return;
              }
            }

            requestAnimationFrame(scan);
          };

          requestAnimationFrame(scan);
        });
      } catch (_) {
        return { status: 'fallback' };
      }
    };
